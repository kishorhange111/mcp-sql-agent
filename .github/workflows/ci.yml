name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (includes the attack suite)
        run: pytest
      - name: Defence evaluation smoke (injection corpus + false positives)
        run: sqlagent-ast-eval --out /tmp/ast_eval.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mcp-sql-agent:ci .
      - name: Image starts and exposes the CLI entry point
        run: docker run --rm --entrypoint sqlagent-ast-eval mcp-sql-agent:ci --benign eval/questions.jsonl
